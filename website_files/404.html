<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Tadic Tools</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="error-page">

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 180px);">
        <div class="card" style="max-width: 550px; width: 100%;">
            <div class="card-content" style="text-align: center; width: 100%;">
                <div style="font-size: 6rem; font-weight: 900; line-height: 1; letter-spacing: -0.05em; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);">404</div>
                
                <!-- Türkçe Mesaj -->
                <div style="margin-bottom: 25px;">
                    <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 12px;">Aradığınız sayfa bulunamadı</h2>
                    <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 0;">Bağlantı hatalı olabilir veya sayfa kaldırılmış olabilir.</p>
                </div>

                <div style="height: 1px; background: var(--glass-border); margin: 25px 0; width: 100%;"></div>

                <!-- İngilizce Mesaj -->
                <div style="margin-bottom: 35px;">
                    <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">Page not found</h2>
                    <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 0;">The link might be broken or the page may have been removed.</p>
                </div>

                <a href="/" class="download-btn" style="text-decoration: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Ana Sayfa / Go Home</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
